spring:
  application:
    name: srm-credit-engine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/srm_credit_engine}
    username: ${SPRING_DATASOURCE_USERNAME:srm}
    password: ${SPRING_DATASOURCE_PASSWORD:srm_local_password}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
        allowed-methods: GET

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
